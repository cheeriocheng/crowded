<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crowded — visual</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The scene sits in a frame, not the whole window. Later several frames
     will share the space. */
  #frame {
    position: relative;
    width: min(62vw, 110vh);
    background: #0c0c0c;
    outline: 1px solid #222;
  }
  #frame canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; left: 0; right: 0; top: 100%;
    margin-top: 10px; text-align: center; color: #555;
    font: 12px/1.4 -apple-system, system-ui, sans-serif;
  }
  #status {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    text-align: center; color: #777;
    font: 14px/1.4 -apple-system, system-ui, sans-serif;
    padding: 0 24px;
  }
</style>
</head>
<body>
<div id="frame">
  <div id="status">loading scene…</div>
  <div id="hint">drag to orbit · scroll to zoom · right-drag to pan · R to reset</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
